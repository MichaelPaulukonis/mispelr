<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mispelr - a machine for misspelling</title>
    <meta
      name="description"
      content="Mispelr mangles your text: real-world misspellings, homophones, doubled letters, transpositions."
    />
    <link rel="icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600;700&family=JetBrains+Mono:wght@500&display=swap"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <section class="hero grid">
      <div class="meta label" aria-live="polite">
        <span><b>Method</b> <span id="ro-method">&mdash;</span></span>
        <span><b>Chance</b> <span id="ro-chance">&mdash;</span></span>
        <span><b>Changed</b> <span id="ro-changed">&mdash;</span></span>
      </div>
      <div class="body">
        <h1 class="display" data-respell="mispelr" title="clik me">mispelr</h1>
        <p class="lede">A machine for misspelling.</p>
      </div>
    </section>

    <main class="grid work">
      <section class="step">
        <h2 class="step-h"><span class="num">01</span>Input</h2>
        <textarea id="input" spellcheck="false" aria-label="Text to misspell">There their they are, where we were. Mispelr mangles your text in a variety of configurable ways - edit this and try it out.</textarea>
      </section>

      <section class="step">
        <h2 class="step-h"><span class="num">02</span>Method</h2>
        <ul class="methods">
          <li><label class="method"><input type="radio" name="spelltype" value="random" checked /><span class="pill">Random</span><small>any of the five, word by word</small></label></li>
          <li><label class="method"><input type="radio" name="spelltype" value="maledict" /><span class="pill">Maledict</span><small>real-world misspellings</small></label></li>
          <li><label class="method"><input type="radio" name="spelltype" value="homophilia" /><span class="pill">Homophilia</span><small>swaps in homophones</small></label></li>
          <li><label class="method"><input type="radio" name="spelltype" value="awfowell" /><span class="pill">Awfowell</span><small>doubles the vowels</small></label></li>
          <li><label class="method"><input type="radio" name="spelltype" value="constonantSorrow" /><span class="pill">ConstonantSorrow</span><small>doubles the consonants</small></label></li>
          <li><label class="method"><input type="radio" name="spelltype" value="maxmister" /><span class="pill">Maxmister</span><small>transposes letters</small></label></li>
        </ul>
        <label class="chance label">Chance
          <input id="chance" type="range" min="0" max="100" step="5" value="50" />
          <output id="chance-out" for="chance">50%</output>
        </label>
        <button id="respell" type="button">Respell &nbsp;&#8984;&#8629;</button>
      </section>

      <section class="step out">
        <h2 class="step-h"><span class="num">03</span>Output</h2>
        <p id="output" class="output" aria-live="polite"></p>
      </section>
    </main>

    <footer class="legend grid">
      <div class="span-4"><span class="key">Changed word</span></div>
      <div class="span-4">
        <a href="https://github.com/MichaelPaulukonis/textgen-monorepo/tree/main/libs/mispelr">GitHub</a>
        &middot;
        <a href="https://michaelpaulukonis.github.io/">Michael Paulukonis</a>
      </div>
      <div class="span-4 right">node-mispelr <span id="version"></span> &middot; 2015&ndash;2026</div>
    </footer>

    <script src="js/mispelr.bundle.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
